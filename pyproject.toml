[project]
name = "knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection (Kaggle 2026) - multi-planar knee MRI plus multilingual radiology report text"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pydicom>=3.0",
    # Series ship in a mix of transfer syntaxes (JPEG Lossless, JPEG 2000, and two
    # uncompressed VRs). pydicom alone decodes only the uncompressed ones.
    "pylibjpeg[all]>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Kaggle CLI is only needed on the machine that pulls the competition archive, and it drags
# in its own auth stack. Split out so `uv sync` on a training host stays lean.
data = ["kaggle>=1.6"]
# Vision side. monai carries the 3D/volumetric transforms and losses that plain torchvision
# does not; timm carries the 2D backbones for per-slice models.
train = [
    "torch>=2.5",
    "torchvision>=0.20",
    "monai>=1.4",
    "timm>=1.0",
    "scikit-learn>=1.5",
]
# Report text is in ~9-12 languages, so the text encoder has to be multilingual from the
# start - see docs/competition-notes.md.
text = ["transformers>=4.51", "sentencepiece>=0.2", "accelerate>=1.0"]
plot = [
    "matplotlib>=3.9",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "pandas-stubs>=3.0.5.260730",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# Without these pyright resolves against the system interpreter, so every third-party
# import fails and the resulting "unknown type" cascade hides real errors.
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
